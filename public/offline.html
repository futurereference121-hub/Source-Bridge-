<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020B1C" />
    <title>Source Bridge — Needs internet</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #020B1C;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      main {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
        text-align: center;
      }
      .mark { width: 72px; height: 72px; margin-bottom: 1.5rem; }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      p {
        margin: 0 0 1.75rem;
        max-width: 22rem;
        line-height: 1.5;
        color: rgba(255,255,255,0.7);
        font-size: 0.95rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        background: #3B82F6;
        color: #fff;
        font: inherit;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.75rem;
        padding: 0.85rem 1.5rem;
        min-height: 44px;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/icon-192.png" width="72" height="72" alt="Source Bridge" />
      <h1>You're offline</h1>
      <p>Source Bridge needs an internet connection. Connect and try again — nothing was saved or submitted while offline.</p>
      <button type="button" id="retry">Retry</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
